name: Release Hygiene

on:
  pull_request:
  push:

jobs:
  release-hygiene:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate agent operating layer
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\validate-agent-operating-layer.ps1

      - name: Validate plugin operating-layer assets
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\validate-plugin-operating-layer-assets.ps1

      - name: Test SAP authorization review packs
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\test-authorization-review-packs.ps1

      - name: Validate release hygiene
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts\validate-release-hygiene.ps1
