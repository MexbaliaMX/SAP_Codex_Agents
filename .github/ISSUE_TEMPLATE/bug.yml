name: Bug
description: Report a repository defect that does not involve sensitive data.
title: "Bug: "
labels: ["bug"]
body:
  - type: input
    id: owner
    attributes:
      label: Owner
      description: Who is accountable for triage and closure?
      placeholder: Owner required
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - P0
        - P1
        - P2
    validations:
      required: true
  - type: input
    id: milestone
    attributes:
      label: Milestone
      placeholder: v0.2.0-final
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What is wrong?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence requirements
      description: Commands, files, logs, screenshots, or authoritative references. Do not include secrets or client data.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: Related issues, approvals, or validation prerequisites.
    validations:
      required: true
  - type: textarea
    id: security-boundary
    attributes:
      label: Security boundary
      description: State whether secrets, tenants, MCP, hooks, production configuration, roles, transports, or client data are affected.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
    validations:
      required: true
